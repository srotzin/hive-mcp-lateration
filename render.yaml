services:
  - type: web
    name: hive-mcp-lateration
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev --no-audit --no-fund
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: HIVE_SIGNER_URL
        value: https://hive-typed-signer.onrender.com
      - key: ENABLE
        value: "true"
    healthCheckPath: /health
    autoDeploy: true
